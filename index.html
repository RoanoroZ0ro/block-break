<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Break · Made by Lucas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The whole game lives in one full-screen box -->
  <div class="game-screen" id="gameScreen">

    <!-- Score / best / lives (floats at the top) -->
    <div class="hud">
      <div class="stat" id="stat-score">
        <span class="label">SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="stat stat-lives" id="stat-lives">
        <span class="label">LIVES</span>
        <span class="value" id="lives">&#9829;&#9829;&#9829;</span>
      </div>
      <div class="stat" id="stat-best">
        <span class="label">BEST</span>
        <span class="value" id="best">0</span>
      </div>
    </div>

    <!-- The canvas is where the game is drawn (scaled to fill the screen) -->
    <canvas id="gameCanvas"></canvas>

    <!-- Message that appears over the game (Start / Win / Lost) -->
    <div class="message" id="message">
      <h2 class="msg-title" id="msgTitle">Ready?</h2>
      <p class="msg-text" id="msgText">Move the paddle with your mouse or the arrow keys.<br>Don't let the ball touch the floor!</p>

      <!-- Name entry that shows when you lose, to save your score -->
      <div class="score-entry" id="scoreEntry" style="display:none">
        <input id="nameInput" maxlength="12" placeholder="Your name" autocomplete="off">
        <button id="saveScoreBtn" class="btn btn-save">Save to leaderboard ➜</button>
      </div>

      <button id="startBtn" class="btn btn-big">▶ Start Game</button>
    </div>

    <!-- Leaderboard panel, always visible on the side -->
    <div class="leaderboard" id="leaderboard">
      <h3>🏆 Top Scores</h3>
      <ol id="leaderboardList"></ol>
    </div>

    <!-- Control buttons (floats at the bottom) -->
    <div class="controls">
      <button id="pauseBtn" class="btn btn-cta">⏸ Pause</button>
      <button id="resumeBtn" class="btn btn-cta">▶ Resume</button>
      <button id="restartBtn" class="btn btn-cta">↻ Restart</button>
      <button id="musicBtn" class="btn btn-cta">🎵 Music: On</button>
      <button id="fullscreenBtn" class="btn btn-cta">⛶ Fullscreen</button>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
