# nginx/default.conf - tells nginx how to serve our files
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # try the file, then file.html, then the folder - otherwise 404
        try_files $uri $uri.html $uri/ =404;
    }

    # During development, tell the browser NOT to remember old versions
    # of the game files, so edits show up on refresh.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}